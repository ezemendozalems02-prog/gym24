<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <g stroke="#FFD400" stroke-width="11" stroke-linecap="round">
    <!-- figure 1: arms raised celebrating -->
    <circle cx="70" cy="55" r="13" fill="#FFD400" stroke="none" />
    <line x1="70" y1="68" x2="70" y2="120" />
    <line x1="70" y1="80" x2="45" y2="45" />
    <line x1="70" y1="80" x2="95" y2="45" />
    <line x1="70" y1="120" x2="55" y2="175" />
