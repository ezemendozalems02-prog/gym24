    <circle cx="255" cy="55" r="13" fill="#FFD400" stroke="none" />
    <line x1="255" y1="68" x2="255" y2="122" />
    <line x1="255" y1="80" x2="235" y2="100" />
    <line x1="255" y1="80" x2="275" y2="100" />
